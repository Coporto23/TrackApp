# Pipeline de TrackApp: push a `develop` → QA, push a `main` (merge desde develop) → Producción.
# 1) valida (tsc + lint)  2) construye y publica la imagen en GHCR  3) despliega por SSH.
# Secretos del repositorio: SSH_HOST, SSH_USER, SSH_KEY (clave privada), SSH_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/coporto23/trackapp
  # qa | prod según la rama
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}

jobs:
  verify:
    name: Validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  image:
    name: Construir imagen
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: App
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrate
          cache-from: type=gha

  deploy:
    name: Desplegar
    needs: image
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    # Un despliegue a la vez por entorno; el siguiente espera (no se cancela a medias).
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    # Secretos como variables de entorno (no interpolados en el script).
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copiar archivos
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:/opt/trackapp/$ENV_NAME/"
      - name: Desplegar ${{ env.ENV_NAME }}
        # El token temporal del job va por stdin para descargar la imagen (no queda en el servidor).
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "GHCR_USER=$GHCR_USER bash /opt/trackapp/$ENV_NAME/deploy.sh $ENV_NAME $SHA"
