# Proxy inverso compartido por QA y Producción (en /opt/trackapp/traefik).
# Único contenedor que publica puertos (80 y 443). Enruta por subdominio a los
# contenedores con `traefik.enable=true` de la red externa "web" y obtiene
# certificados de Let's Encrypt (desafío HTTP-01). Sin dashboard.
# .env: ACME_EMAIL (aviso de vencimiento de certificados).
#   docker network create web   (una vez)
#   docker compose up -d

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Falta ACME_EMAIL en .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks: [web]

networks:
  web:
    external: true
